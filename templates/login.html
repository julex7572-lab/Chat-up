<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ChatUp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef3ff;
            color: #222;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            padding: 28px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 18px #0001;
        }

        h1 {
            text-align: center;
            color: #1769ff;
        }

        p {
            text-align: center;
            line-height: 1.5;
            color: #667085;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: 1px solid #d5dbea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #1769ff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            color: #c62828;
            text-align: center;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
        }

        a {
            color: #1769ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💬 ChatUp</h1>

    <p>Welcome back! Log in to continue chatting.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <label for="identity">
            Email address or phone number
        </label>

        <input
            type="text"
            id="identity"
            name="identity"
            placeholder="Enter email or phone number"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Log In
        </button>

    </form>

    <div class="footer">
        Don't have an account?
        <a href="{{ url_for('signup') }}">Create one</a>
        <br><br>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>

</div>

</body>
</html>
