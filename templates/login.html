<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ChatUp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #eef3ff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 420px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 18px #0001;
        }

        h1 {
            text-align: center;
            color: #1769ff;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #1769ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
        }

        a {
            color: #1769ff;
            text-decoration: none;
        }

        .error {
            color: #d00;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💬 ChatUp</h1>
        <p>Welcome back! Log in to continue.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="/login" method="POST">
            <label for="username">Username or email</label>
            <input
                id="username"
                type="text"
                name="username"
                placeholder="Enter username or email"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p>New to ChatUp? <a href="/signup">Create an account</a></p>
    </div>
</body>
              </html>
