<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatUp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3ff;
            color: #222;
        }

        header {
            background: #1769ff;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        main {
            max-width: 450px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px #0001;
        }

        h1 {
            color: #1769ff;
        }

        p {
            line-height: 1.6;
        }

        a {
            display: block;
            margin: 15px 0;
            padding: 14px;
            background: #1769ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #0752d6;
        }
    </style>
</head>

<body>
    <header>💬 ChatUp</header>

    <main>
        <h1>Welcome to ChatUp!</h1>

        <p>Connect with friends and chat together.</p>

        <a href="/signup">Create an Account</a>

        <a href="/login">Log In</a>
    </main>
</body>
      </html>
